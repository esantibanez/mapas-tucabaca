# Descarga cada día las órbitas (TLE) de CelesTrak para la página satelites/
name: Actualizar órbitas de satélites
on:
  schedule:
    - cron: "23 9 * * *"   # todos los días, 05:23 hora de Bolivia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  orbitas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar TLE
        run: |
          set -e
          base="https://celestrak.org/NORAD/elements/gp.php?FORMAT=tle&GROUP="
          curl -fsSL --retry 3 "${base}resource" -o /tmp/a.txt
          curl -fsSL --retry 3 "${base}weather"  -o /tmp/b.txt
          curl -fsSL --retry 3 "https://celestrak.org/NORAD/elements/gp.php?FORMAT=tle&NAME=SENTINEL-1" -o /tmp/c.txt || true
          cat /tmp/a.txt /tmp/b.txt /tmp/c.txt > satelites/tles.txt
          grep -c "^1 " satelites/tles.txt
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add satelites/tles.txt
          git diff --cached --quiet || git commit -m "Órbitas actualizadas $(date -u +%F)"
          git push
